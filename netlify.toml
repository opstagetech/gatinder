[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA: /admin, /admin/... e /tv abrem direto (sem 404)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# O service worker precisa sempre da versão mais nova
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
